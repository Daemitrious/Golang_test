services:
  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--auth", "local-dev-token"]
    ports:
      - "4222:4222"
      - "8222:8222"

  service:
    build:
      context: .
      args:
        APP: service
    depends_on:
      - nats
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: :8080
      NATS_URL: nats://local-dev-token@nats:4222
      NATS_SUBJECT: search.events
      NATS_QUEUE: search-trends
      WINDOW_SECONDS: 300
      MAX_TOP_LIMIT: 100
      MAX_EVENTS_PER_USER_QUERY_PER_MINUTE: 30
      MAX_PAYLOAD_BYTES: 4096
      MAX_QUERY_LENGTH: 120
      ADMIN_TOKEN: local-admin-token
      DEDUP_TTL_SECONDS: 600
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  demo-producer:
    profiles: ["demo"]
    build:
      context: .
      args:
        APP: demo-producer
    depends_on:
      - nats
    environment:
      NATS_URL: nats://local-dev-token@nats:4222
      NATS_SUBJECT: search.events
    command: ["/app/app", "-rate", "100"]

  prometheus:
    image: prom/prometheus:v2.54.1
    depends_on:
      service:
        condition: service_started
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.1.0
    depends_on:
      prometheus:
        condition: service_started
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
